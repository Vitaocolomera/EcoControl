name: CD - Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore EcoControl.sln

      - name: Build
        run: dotnet build EcoControl.sln -c Release --no-restore

      - name: Tests
        run: dotnet test EcoControl.sln -c Release --no-build

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecocontrol-api:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/ecocontrol-api:staging-${{ github.sha }}

  deploy:
    needs: [build-test-push]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy Azure Staging
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_STAGING }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ecocontrol-api:staging-${{ github.sha }}
