name: CD - Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore EcoControl.sln

      - name: Build
        run: dotnet build EcoControl.sln -c Release --no-restore

      - name: Tests
        run: dotnet test EcoControl.sln -c Release --no-build

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecocontrol-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecocontrol-api:prod-${{ github.sha }}

  deploy:
    needs: [build-test-push]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy Azure Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ecocontrol-api:prod-${{ github.sha }}
